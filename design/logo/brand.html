<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:S;src:url('../../node_modules/@fontsource-variable/schibsted-grotesk/files/schibsted-grotesk-latin-wght-normal.woff2') format('woff2');font-weight:400 900}
body{margin:0;width:1600px;background:#050607;color:#e9e7e2;font-family:S,sans-serif;padding:56px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:24px}
.tile{border:1px solid #2a2e33;border-radius:14px;padding:40px;display:grid;place-items:center;gap:28px;min-height:330px}
.coal{background:#101214}.paper{background:#f3f1ec;color:#16181b}
.lock{display:flex;align-items:center;gap:22px}.word{font-weight:500;letter-spacing:.45em;margin-right:-.45em}
.row{display:flex;align-items:end;gap:28px}.row span{display:block;text-align:center;color:#8e9196;font-size:12px;margin-top:8px}
.sw{display:flex;gap:14px}.sw div{width:120px;height:84px;border-radius:10px;border:1px solid #2a2e33;padding:10px;font-size:12px;display:flex;flex-direction:column;justify-content:end}
h1{margin:0 0 6px;font-size:28px;font-weight:600;letter-spacing:-.02em}p.s{margin:0 0 36px;color:#8e9196}
</style></head><body>
<h1>SALEM — mark B, “Beyond the window”</h1><p class="s">A window left open, with the light outside it. AI that lives beyond the chat window.</p>
<div class="grid">
 <div class="tile coal"><img src="salem-mark.svg" width="260"><div class="lock"><img src="salem-mark.svg" width="52"><span class="word" style="font-size:38px">SALEM</span></div></div>
 <div class="tile paper"><img src="salem-mark-light.svg" width="150"><div class="lock"><img src="salem-mark-light.svg" width="40"><span class="word" style="font-size:28px">SALEM</span></div></div>
 <div class="tile"><div class="row">
   <div><img src="../../public/favicon.svg" width="16"><span>16</span></div>
   <div><img src="../../public/favicon.svg" width="32"><span>32</span></div>
   <div><img src="../../public/favicon.svg" width="64"><span>64</span></div>
   <div><img src="../../public/favicon.svg" width="128" style="border-radius:28px"><span>App icon</span></div>
 </div></div>
 <div class="tile"><div class="sw">
   <div style="background:#050607">Night<br>#050607</div><div style="background:#101214">Coal<br>#101214</div>
   <div style="background:#e9e7e2;color:#16181b">Text<br>#E9E7E2</div><div style="background:#e8c46a;color:#16181b">Lamp<br>#E8C46A</div>
 </div><div style="font-size:40px;font-weight:600;letter-spacing:-.04em">Schibsted Grotesk</div></div>
</div></body></html>
