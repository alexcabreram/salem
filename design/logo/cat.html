<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SALEM cat exploration</title>
<style>
  @font-face { font-family:S; src:url('../../node_modules/@fontsource-variable/schibsted-grotesk/files/schibsted-grotesk-latin-wght-normal.woff2') format('woff2'); font-weight:400 900; }
  :root { --night:#050607; --coal:#101214; --line:#2a2e33; --text:#e9e7e2; --muted:#8e9196; --lamp:#e8c46a; --paper:#f3f1ec; --ink:#16181b; }
  body { margin:0; width:1600px; background:var(--night); color:var(--text); font-family:S,sans-serif; padding:56px; box-sizing:border-box; }
  h1 { font-size:28px; font-weight:600; letter-spacing:-.02em; margin:0 0 6px; }
  .sub { color:var(--muted); margin:0 0 40px; }
  .opt { display:grid; grid-template-columns:330px 1fr 250px 230px; border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-bottom:24px; }
  .opt > div { padding:28px; display:grid; align-content:center; gap:14px; }
  .opt > div + div { border-left:1px solid var(--line); }
  .name { font-size:21px; font-weight:600; }
  .idea { color:var(--muted); font-size:14.5px; line-height:1.5; }
  .big { background:var(--coal); place-items:center; }
  .lock { display:flex; align-items:center; gap:16px; }
  .word { font-weight:500; letter-spacing:.42em; margin-right:-.42em; font-size:28px; }
  .row { display:flex; align-items:end; gap:16px; }
  .row span { display:block; text-align:center; color:var(--muted); font-size:12px; margin-top:6px; }
  .light { background:var(--paper); color:var(--ink); place-items:center; }
  .light .word { font-size:19px; }
  .states { display:flex; gap:18px; }
  .states div { text-align:center; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff4d6" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#e8c46a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#e8c46a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- K1: the open window grows ears. The light stays outside. -->
  <symbol id="k1" viewBox="0 0 64 64">
    <path d="M36 15 H 30.5 L 22.5 6 L 18.5 15 H 21 A 10 10 0 0 0 11 25 V 43 A 10 10 0 0 0 21 53 H 43 A 10 10 0 0 0 53 43 V 30"
          fill="none" stroke="currentColor" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18.5 15 L 13 8 L 11.5 20" fill="none" stroke="currentColor" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="48" cy="19" r="13" fill="url(#glow)"/>
    <circle cx="48" cy="19" r="5.6" fill="#fff4d6"/>
  </symbol>

  <!-- K2: Familiar. The window is the cat's head; its eyes are the light, in a slow blink (trust). -->
  <symbol id="k2" viewBox="0 0 64 64">
    <path d="M12 44 V 12 L 23.5 21 H 40.5 L 52 12 V 44 A 10 10 0 0 1 42 54 H 22 A 10 10 0 0 1 12 44 Z"
          fill="none" stroke="currentColor" stroke-width="4.4" stroke-linejoin="round"/>
    <path d="M21 37 Q 25.5 41 30 37 M34 37 Q 38.5 41 43 37" fill="none" stroke="#e8c46a" stroke-width="3.4" stroke-linecap="round"/>
  </symbol>
  <symbol id="k2-open" viewBox="0 0 64 64">
    <path d="M12 44 V 12 L 23.5 21 H 40.5 L 52 12 V 44 A 10 10 0 0 1 42 54 H 22 A 10 10 0 0 1 12 44 Z"
          fill="none" stroke="currentColor" stroke-width="4.4" stroke-linejoin="round"/>
    <circle cx="25.5" cy="36.5" r="9" fill="url(#glow)"/><circle cx="38.5" cy="36.5" r="9" fill="url(#glow)"/>
    <path d="M20.5 36.5 Q 25.5 30.5 30.5 36.5 Q 25.5 42.5 20.5 36.5 Z M33.5 36.5 Q 38.5 30.5 43.5 36.5 Q 38.5 42.5 33.5 36.5 Z" fill="#e8c46a"/>
    <ellipse cx="25.5" cy="36.5" rx="1.1" ry="4" fill="#050607"/><ellipse cx="38.5" cy="36.5" rx="1.1" ry="4" fill="#050607"/>
  </symbol>

  <!-- K3: Eyes in the dark. Only the light: two cat eyes. -->
  <symbol id="k3" viewBox="0 0 64 64">
    <circle cx="21" cy="32" r="14" fill="url(#glow)"/><circle cx="43" cy="32" r="14" fill="url(#glow)"/>
    <path d="M10 33 Q 19 21 30 31 Q 21 43 10 33 Z" fill="#e8c46a"/>
    <path d="M54 33 Q 45 21 34 31 Q 43 43 54 33 Z" fill="#e8c46a"/>
    <ellipse cx="20.5" cy="32" rx="1.6" ry="6.5" fill="#050607"/><ellipse cx="43.5" cy="32" rx="1.6" ry="6.5" fill="#050607"/>
  </symbol>
</svg>

<h1>SALEM — the cat, explored</h1>
<p class="sub">Three ways to bring the cat into the identity without turning it into a mascot.</p>

<script>
  const opts = [
    ['k1', 'K1 — Ears on the window', 'The current mark, evolved: the open window grows two ears; the light still sits outside it. Keeps everything we have, adds the cat as a silhouette you notice the second time.'],
    ['k2', 'K2 — Familiar', 'The window becomes the cat\'s head and the light becomes its eyes. Idle, it slow-blinks: in cats that means trust. When SALEM listens, the eyes open. A familiar: the companion that helps, in folklore.'],
    ['k3', 'K3 — Eyes in the dark', 'Only the light: two cat eyes on black. Striking and memorable, but eyes on an AI read as surveillance, which works against a product built on user control.'],
  ];
  for (const [id, name, idea] of opts) {
    const u = (s, c = 'var(--text)', sym = id) => `<svg width="${s}" height="${s}" style="color:${c}"><use href="#${sym}"/></svg>`;
    const extra = id === 'k2'
      ? `<div class="states"><div>${u(64)}<br>Idle: slow blink</div><div>${u(64, 'var(--text)', 'k2-open')}<br>Listening</div></div>`
      : `<div class="row">${[16, 24, 32, 48].map((s) => `<div>${u(s)}<span>${s}</span></div>`).join('')}</div>`;
    document.body.insertAdjacentHTML('beforeend', `
      <section class="opt">
        <div><div class="name">${name}</div><div class="idea">${idea}</div></div>
        <div class="big">${u(190)}<div class="lock" style="margin-top:22px">${u(44)}<span class="word">SALEM</span></div></div>
        <div>${extra}${id === 'k2' ? `<div class="row">${[16, 24, 32].map((s) => `<div>${u(s)}<span>${s}</span></div>`).join('')}</div>` : ''}</div>
        <div class="light">${u(92, 'var(--ink)')}<div class="lock">${u(28, 'var(--ink)')}<span class="word">SALEM</span></div></div>
      </section>`);
  }
</script>
</body>
</html>
